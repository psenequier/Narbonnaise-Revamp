      <path d="M378 364 L420 352 L466 365 L442 368 L420 362 L398 369 Z" fill="#FFFFFF"/>
      <path d="M0 425 L160 405 L330 428 L500 408 L640 425 L640 460 L0 460 Z" fill="#FFFFFF"/>
      <path d="M0 440 L180 428 L360 444 L520 430 L640 442 L640 460 L0 460 Z" fill="#E3EEF3"/>
