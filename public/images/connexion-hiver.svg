<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Deux cabines de téléphérique, une rouge et une jaune, se croisent au-dessus des montagnes enneigées">
  <style>
    .rouge { animation: aller 20s ease-in-out -7s infinite alternate; }
    .jaune { animation: retour 20s ease-in-out -7s infinite alternate; }
    @keyframes aller  { from { transform: translate(0, 0); } to { transform: translate(340px, 85px); } }
    @keyframes retour { from { transform: translate(0, 0); } to { transform: translate(-340px, -85px); } }
    @media (prefers-reduced-motion: reduce) {
      .rouge, .jaune { animation: none; }
      .rouge { transform: translate(120px, 30px); }
      .jaune { transform: translate(-120px, -30px); }
    }
  </style>

      <circle cx="505" cy="86" r="50" fill="#F6DF8E"/>
