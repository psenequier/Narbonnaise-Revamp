<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Deux cabines de téléphérique, une rouge et une jaune, se croisent au-dessus des montagnes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .rouge { animation: aller 18s ease-in-out -6s infinite alternate; }
    .jaune { animation: retour 18s ease-in-out -6s infinite alternate; }
    .balance { transform-box: view-box; animation: balance 18s ease-in-out -6s infinite alternate; }
    .rouge .balance { transform-origin: 136px 44.9px; }
    .jaune .balance { transform-origin: 1201.5px 90.4px; }
    @keyframes aller  { from { transform: translate(0, 0); } to { transform: translate(900px, 58.75px); } }
    @keyframes retour { from { transform: translate(0, 0); } to { transform: translate(-900px, -58.75px); } }
    @keyframes balance { 0% { transform: rotate(0); } 8% { transform: rotate(-2deg); } 92% { transform: rotate(-2deg); } 100% { transform: rotate(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rouge, .jaune, .balance { animation: none; }
      .rouge { transform: translate(270px, 17.6px); }
      .jaune { transform: translate(-270px, -17.6px); }
    }
  </style>
