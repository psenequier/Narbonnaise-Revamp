# Analyse automatique de SonarCloud (tant que le secret SONAR_TOKEN n'est pas créé ;
# ensuite l'analyse passe par la CI et sonar-project.properties, même périmètre).
# Les tests sont du code de test : fixtures GRR en MD5, URL en HTTP refusées exprès, etc.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,resources/**/*.svg,rapports/**
sonar.test.exclusions=tests/**/*.sql
sonar.sourceEncoding=UTF-8
