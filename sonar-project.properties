# SonarCloud : analyse lancée par la CI (job « sonar » de .github/workflows/ci.yml).
# Clés par défaut de l'import d'un dépôt GitHub dans SonarCloud.
sonar.organization=psenequier
sonar.projectKey=psenequier_Narbonnaise-Revamp
sonar.projectName=Narbonnaise-Revamp

sonar.sources=app,bootstrap/app.php,config,database,resources,routes
sonar.tests=tests
sonar.exclusions=resources/**/*.svg,public/build/**
# Fixture GRR synthétique : du SQL de test, pas du code à analyser.
sonar.test.exclusions=tests/**/*.sql
sonar.sourceEncoding=UTF-8

# Couverture : même périmètre que la règle des 90 % (phpunit.xml, <source>) : app/Domain.
sonar.php.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=app/Actions/**,app/Console/**,app/Http/**,app/Mail/**,app/Models/**,app/Notifications/**,app/Providers/**,bootstrap/**,config/**,database/**,resources/**,routes/**
