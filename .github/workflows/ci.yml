# Chaîne CI (ADR 016, RFC « Environnement d'intégration continue »).
# Actions épinglées par empreinte SHA (version en commentaire) ; Dependabot
# propose les mises à jour chaque lundi.
name: ci

on:
  pull_request:
  push:
    # main, et les branches de travail (retour de CI sans attendre la pull request)
    branches: [main, "socle/**", "lot/**", "correctif/**"]
  workflow_dispatch: # utilisé par le job « temoin » du workflow hebdo

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"

jobs:
  tests:
    name: tests (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ptest" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          extensions: pdo_mysql, sockets
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Le plugin Pest Browser exige le paquet playwright même quand ses tests sont exclus.
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests et couverture (90 % sur app/Domain)
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pest --ci --coverage --min=90 --exclude-group=browser --colors=never 2>&1 | tee pest.log || {
            # Dépôt public : les journaux complets demandent un compte ; on remonte la fin en annotation.
            # Une annotation par test en échec (20 lignes de contexte), puis le bilan.
            grep -n "FAILED" pest.log | head -n 10 | cut -d: -f1 | while read -r n; do
              echo "::error title=Pest (échec)::$(sed -n "${n},$((n + 20))p" pest.log | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            done
            echo "::error title=Pest::$(tail -n 40 pest.log | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            exit 1
          }
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Chaque critère d'acceptation a son test
        # Non bloquant pendant le développement ; bloquant avec CRITERES_BLOQUANTS=oui (recette, T37).
        run: php scripts/verifier-criteres.php --lot=MVP ${{ vars.CRITERES_BLOQUANTS == 'oui' && '' || '--non-bloquant' }}

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Psalm, analyse de propagation (injections, SSRF, XSS)
        run: vendor/bin/psalm --taint-analysis --no-progress --report=psalm.sarif
      - name: Semgrep, règles OWASP Top 10 et PHP
        run: |
          pipx install semgrep
          semgrep scan --config p/owasp-top-ten --config p/php --config .semgrep/ \
            --sarif --output semgrep.sarif --json-output=semgrep.json --error --severity ERROR || {
            python3 -c "import json;[print(f\"::error file={r['path']},line={r['start']['line']},title=Semgrep::{r['check_id'].split('.')[-1]}\") for r in json.load(open('semgrep.json'))['results']]"
            exit 1
          }
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: psalm.sarif
          category: psalm
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependances:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique pour Gitleaks
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Audit Composer
        shell: bash
        run: |
          composer audit --locked --no-interaction > audit.log 2>&1 || {
            echo "::error title=composer audit::$(sed 's/%/%25/g' audit.log | tr '\n' '|' | sed 's/|/%0A/g' | cut -c1-3000)"
            exit 1
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm audit --audit-level=high
      - name: Aucun fichier .env commis
        run: "! git ls-files | grep -E '(^|/)\\.env$'"
      - name: Gitleaks (ligne de commande, licence libre)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          # Historique de la branche testée seulement (par défaut Gitleaks lit toutes les
          # branches, dont « temoin » et sa fausse clé volontaire).
          ./gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="HEAD" \
            --report-format json --report-path gitleaks.json || {
            echo "::error title=Gitleaks::$(python3 -c "import json;print('%0A'.join(f\"{f['RuleID']} {f['File']}:{f['StartLine']} ({f['Commit'][:7]})\" for f in json.load(open('gitleaks.json'))))")"
            exit 1
          }

  interface:
    needs: [tests, sast, dependances]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: e2e
          MYSQL_ROOT_PASSWORD: e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -pe2e" --health-interval=5s --health-retries=20
    env:
      DB_DATABASE: e2e
      DB_PASSWORD: e2e
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, sockets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.ci .env && php artisan key:generate
      - name: Site éphémère avec données fictives
        run: |
          php artisan migrate --seed --seeder=DonneesFictivesSeeder --force
          php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &
      - name: Attendre que le site éphémère réponde (60 s au plus)
        run: timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8000/login; do sleep 1; done'
      - name: Cache des navigateurs Playwright
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Le miroir apt d'Ubuntu bloque parfois de longues minutes (job annulé le 27/10) :
      # 5 minutes au plus par essai, 3 essais.
      - name: Installer les navigateurs et leurs dépendances système
        shell: bash
        run: |
          for essai in 1 2 3; do
            if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
              timeout 300 npx playwright install-deps chromium webkit && exit 0
            else
              timeout 300 npx playwright install --with-deps chromium webkit && exit 0
            fi
            echo "::warning title=Playwright::essai $essai échoué ou trop long, nouvel essai"
            sleep 10
          done
          exit 1
      - name: Tests d'interface (Chrome, WebKit, iPhone) et accessibilité
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pest --ci --group=browser --colors=never 2>&1 | tee pest-browser.log || {
            echo "::error title=Pest Browser::$(tail -n 40 pest-browser.log | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            exit 1
          }
      - name: Scan ZAP passif, connecté avec un compte de test
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: .zap/regles.tsv
          # Le seuil est appliqué à l'étape suivante (moyenne ou plus = blocage).
          fail_action: false
          allow_issue_writing: false
      - name: Seuil ZAP (alerte moyenne ou plus, hors exceptions justifiées)
        shell: bash
        run: |
          [ -f report_json.json ] || { echo "::error title=ZAP::rapport absent"; exit 1; }
          python3 - <<'PY'
          import json, sys
          ignorees = set()
          for ligne in open('.zap/regles.tsv', encoding='utf-8'):
              if ligne.strip() and not ligne.startswith('#'):
                  champs = ligne.split('\t')
                  if len(champs) > 1 and champs[1].strip() == 'IGNORE':
                      ignorees.add(champs[0].strip())
          lignes, bloquant = [], False
          for site in json.load(open('report_json.json')).get('site', []):
              for a in site.get('alerts', []):
                  urls = sorted({i.get('uri', '') for i in a.get('instances', [])})[:3]
                  ignoree = a.get('pluginid') in ignorees
                  grave = int(a.get('riskcode', 0)) >= 2 and not ignoree
                  bloquant |= grave
                  marque = 'BLOQUANT' if grave else ('justifiée' if ignoree else 'à suivre')
                  lignes.append(f"{marque} [{a.get('riskdesc')}] {a.get('pluginid')} {a.get('name')} : {', '.join(urls)}")
          msg = '%0A'.join(l.replace('%', '%25') for l in lignes) or 'aucune alerte'
          print(f"::{'error' if bloquant else 'notice'} title=ZAP::{msg}")
          sys.exit(1 if bloquant else 0)
          PY
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-interface
          path: |
            tests/Browser/Screenshots
            storage/logs
          retention-days: 7

  deploiement:
    # Activé quand le premier déploiement est préparé (T09) : variable DEPLOIEMENT_ACTIF=oui.
    # Lancement manuel (workflow_dispatch) pour les nuits de répétition et de bascule : voir deploiement/BASCULE.md.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOIEMENT_ACTIF == 'oui'
    needs: [interface]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production # approbation manuelle d'un admin, secrets visibles ici seulement
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: ./deploiement/deployer.sh
        env:
          SFTP_HOTE: ${{ secrets.SFTP_HOTE }}
          SFTP_UTILISATEUR: ${{ secrets.SFTP_UTILISATEUR }}
          SFTP_CLE: ${{ secrets.SFTP_CLE }}
          SFTP_EMPREINTE_HOTE: ${{ secrets.SFTP_EMPREINTE_HOTE }}
          SITE_URL: ${{ vars.SITE_URL }}
          DOSSIER_DISTANT: ${{ vars.DOSSIER_DISTANT }}
          SITE_SERVI: ${{ vars.SITE_SERVI }} # « non » jusqu'à la bascule, puis « oui »
          REPRISE: ${{ vars.REPRISE }} # « oui » seulement les nuits de répétition et de bascule
