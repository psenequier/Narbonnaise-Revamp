# Vérifie que le site local de test (compose.yaml) démarre vraiment, avec ses données fictives.
name: site-local

on:
  pull_request:
    paths: ["compose.yaml", "local/**", ".github/workflows/local.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demarrage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build
      - name: Attendre la page de connexion (15 min au plus)
        run: timeout 900 bash -c 'until curl -sf -o /dev/null http://localhost:8000/login; do sleep 5; done'
      - name: Données fictives chargées, page de connexion servie
        run: |
          curl -sf http://localhost:8000/login | grep -qi 'password'
          n=$(docker compose exec -T mysql mysql -uroot -N chamrousse -e 'select count(*) from users')
          echo "comptes fictifs : $n"
          [ "$n" -ge 10 ]
          ! docker compose exec -T mysql mysql -uroot -N chamrousse -e 'select email from users' | grep -v '@example.test'
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
